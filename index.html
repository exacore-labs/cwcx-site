<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C Systems</title>
<meta name="description" content="C Systems USA LLC">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://cwcx.com/">
<style>
  :root {
    --bg: #0a0a0b;
    --fg: #ededef;
    --muted: #8a8f98;
    --faint: #5c616b;
    --line: #1c1d21;
    --accent: #7c8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }
  .wrap {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 28px;
  }
  header { padding-top: 32px; }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .mark {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: var(--accent);
    display: inline-grid;
    place-items: center;
  }
  .mark svg { display: block; }
  main {
    flex: 1;
    display: flex;
    align-items: center;
  }
  .hero { padding: 96px 0; }
  h1 {
    font-size: clamp(44px, 9vw, 88px);
    font-weight: 600;
    letter-spacing: -0.045em;
    line-height: 1.02;
  }
  .legal {
    margin-top: 22px;
    font-size: clamp(17px, 2vw, 20px);
    color: var(--fg);
    letter-spacing: -0.01em;
  }
  .note {
    margin-top: 6px;
    font-size: clamp(16px, 1.8vw, 18px);
    color: var(--muted);
  }
  .contact {
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--faint);
  }
  .contact a {
    color: var(--fg);
    font-size: 17px;
    text-decoration: none;
    border-bottom: 1px solid #2a2d3a;
    padding-bottom: 2px;
    align-self: flex-start;
    transition: border-color .15s ease, color .15s ease;
  }
  .contact a:hover, .contact a:focus-visible {
    color: #fff;
    border-bottom-color: var(--accent);
    outline: none;
  }
  footer {
    border-top: 1px solid var(--line);
    padding: 24px 0 32px;
    font-size: 13px;
    color: var(--faint);
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover, footer a:focus-visible { color: var(--fg); outline: none; }
  @media (max-width: 480px) {
    .wrap { padding: 0 24px; }
    header { padding-top: 24px; }
    .hero { padding: 72px 0; }
    .contact { margin-top: 40px; }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="./" aria-label="C Systems">
        <span class="mark" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M9.2 3.1A4 4 0 1 0 9.2 8.9" fill="none" stroke="#0a0a0b" stroke-width="1.8" stroke-linecap="round"/></svg></span>
        C Systems
      </a>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="hero">
        <h1>C Systems</h1>
        <p class="legal">C Systems USA LLC</p>
        <p class="note">Private company.</p>
        <div class="contact">
          <span class="label">Contact</span>
          <a href="mailto:support@cwcx.com">support@cwcx.com</a>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div class="wrap">© 2026 C Systems USA LLC · <a href="terms.html">Terms</a> · <a href="privacy.html">Privacy</a></div>
  </footer>
</body>
</html>
